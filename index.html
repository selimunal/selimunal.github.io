<!DOCTYPE html>
<html lang="en">
<!-- selimunal.com without /en/ or /tr/: sends each visitor to the right language. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Selim Ünal | Computational Materials Science &amp; Machine Learning</title>
    <meta name="description" content="Dr. Selim Ünal | Computational Materials Science, Machine Learning, Nanotechnology and Optoelectronics">
    <link rel="canonical" href="https://selimunal.com/">
    <link rel="alternate" hreflang="en" href="https://selimunal.com/en/">
    <link rel="alternate" hreflang="tr" href="https://selimunal.com/tr/">
    <link rel="alternate" hreflang="x-default" href="https://selimunal.com/">

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Link previews (social media, messaging apps, e-mail) -->
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Dr. Selim Ünal">
    <meta property="og:title" content="Dr. Selim Ünal | Computational Materials Science &amp; Machine Learning">
    <meta property="og:description" content="Dr. Selim Ünal | Computational Materials Science, Machine Learning, Nanotechnology and Optoelectronics">
    <meta property="og:url" content="https://selimunal.com/">
    <meta property="og:image" content="https://selimunal.com/og-en.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dr. Selim Ünal - Computational Materials Science, Machine Learning, Nanotechnology, Optoelectronics">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="tr_TR">
    <meta property="profile:first_name" content="Selim">
    <meta property="profile:last_name" content="Ünal">
    <meta name="twitter:card" content="summary_large_image">

    <script>
        const LANG_STORAGE_KEY = 'preferredLang';

        // Is the visitor in Turkey? Checked in the browser, without any external service:
        // the device time zone (Europe/Istanbul) or a TR region in the browser locale (e.g. tr-TR, en-TR).
        function isInTurkey(browserLangs) {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
                if (tz === 'Europe/Istanbul' || tz === 'Asia/Istanbul' || tz === 'Turkey') return true;
            } catch (e) { /* Intl not available */ }
            return browserLangs.some(l => /[-_]tr$/i.test(String(l)));
        }

        // Pick the starting language:
        // 1) a language the visitor chose earlier with the EN/TR buttons,
        // 2) Turkish if the browser's main language is Turkish,
        // 3) Turkish if the visitor is in Turkey (time zone or locale region),
        // 4) otherwise English.
        function detectLanguage() {
            try {
                const saved = localStorage.getItem(LANG_STORAGE_KEY);
                if (saved === 'en' || saved === 'tr') return saved;
            } catch (e) { /* storage blocked: fall through to detection */ }

            const browserLangs = (navigator.languages && navigator.languages.length)
                ? Array.from(navigator.languages)
                : [navigator.language || navigator.userLanguage || ''];
            const primary = String(browserLangs[0] || '').toLowerCase();

            if (primary.startsWith('tr')) return 'tr';
            if (isInTurkey(browserLangs)) return 'tr';
            return 'en';
        }

        // Keep any section link (e.g. selimunal.com/#lectures) when redirecting
        location.replace('/' + detectLanguage() + '/' + location.search + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0F172A;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        a {
            color: #93C5FD;
        }
    </style>
</head>
<body>
    <p>Dr. Selim Ünal · <a href="/en/" hreflang="en">English</a> · <a href="/tr/" hreflang="tr" lang="tr">Türkçe</a></p>
</body>
</html>
